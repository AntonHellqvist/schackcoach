<!doctype html>
<html lang="sv">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a class="brand" href="#/"><img src="vendor/pieces/wN.svg" alt=""> Schackcoach</a>

    </main>
  </div>
  <!-- Flikrad för mobil (visas bara på smala skärmar) -->

    <a href="#/" data-route=""><span>🏠</span>Hem</a>
    <a href="#/traning" data-route="traning"><span>🔥</span>Träna</a>
    <a href="#/spela" data-route="spela"><span>♟</span>Spela</a>
    <a href="#/analys" data-route="analys"><span>📈</span>Partier</a>
    <button type="button" id="more-btn" data-more><span>☰</span>Mer</button>
  </nav>
  <div class="sheet hidden" id="more-sheet">
    <div class="sheet-panel">
      <a href="#/pussel" data-route="pussel"><span>🧩</span> Pussel</a>
      <a href="#/utmaningar" data-route="utmaningar"><span>🏆</span> Utmaningar</a>

      <a href="#/utveckling" data-route="utveckling"><span>📊</span> Min utveckling</a>
      <a href="#/installningar" data-route="installningar"><span>⚙️</span> Inställningar & synk</a>

  </div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>

</html>
